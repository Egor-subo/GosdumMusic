{% extends 'music_portal/base.html' %}
{% block content %}
<section class="card auth-card">
    <h1>Вход администратора</h1>
    {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
    <form method="post" class="form-grid">
        {% csrf_token %}
        <p><label>Логин</label><input name="login" required></p>
        <p><label>Пароль</label><input name="password" type="password" required></p>
        <button type="submit" class="btn">Войти</button>
    </form>
</section>
{% endblock %}
