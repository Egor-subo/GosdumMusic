<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GosdumaMusic</title>
    <link rel="stylesheet" href="/static/music_portal/styles.css">
</head>
<body>
<header class="site-header">
    <div class="container nav-wrap">
        <a class="brand" href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'login' %}{% endif %}">GosdumaMusic</a>
        <nav class="menu">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Личный кабинет</a>
                <a href="{% url 'create_request' %}">Новая заявка</a>
                <a href="{% url 'logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}">Вход</a>
                <a href="{% url 'register' %}">Регистрация</a>
                <a href="{% url 'admin_login' %}">Администратор</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="container page-content">
    {% if messages %}
        {% for message in messages %}
            <div class="alert {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
